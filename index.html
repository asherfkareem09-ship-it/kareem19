<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>G SPORT — Unleash Your Power</title><meta name="description" content="G SPORT premium long-sleeve sportswear. Built for the strong."><meta property="og:title" content="G SPORT"><meta property="og:description" content="Unleash your power. Built for the strong.">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bk:#050505;--rd:#E50914;--dr:#750000;--wh:#fff;--mut:#b9b0b0;--ln:#2a1212;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bk);color:var(--wh);font:400 16px/1.5 Barlow,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.dsp{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.02em;margin:0;text-transform:uppercase}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px}
:focus-visible{outline:2px solid var(--rd);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:#050505e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.logo{font-family:Anton;font-size:26px;letter-spacing:.08em}.logo b{color:var(--rd);font-weight:400}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
nav a,nav button{background:none;border:0;padding:8px 10px;font-weight:700;letter-spacing:.06em;font-size:14px;border-radius:4px}
nav a:hover,nav button:hover{color:var(--rd)}
.btn{display:inline-block;background:var(--rd);color:#fff;border:0;padding:14px 30px;font-family:Anton;letter-spacing:.1em;font-size:18px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);position:relative;overflow:hidden;text-align:center}
.btn:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff7 50%,transparent 70%);transform:translateX(-120%);animation:shine 3s infinite}
.btn.ghost{background:#1b0707;border:0;color:#fff}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.hero{min-height:88vh;min-height:88svh;display:grid;place-items:center;text-align:center;padding:40px 18px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 110%,#7500009a,transparent 60%),radial-gradient(circle at 50% 30%,#1a0000,var(--bk))}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.7}
.hero>div{position:relative}
.hero h1{font-size:clamp(46px,12vw,150px);line-height:.95;text-shadow:0 0 50px #e5091466}
.hero h1 span{display:block;color:transparent;-webkit-text-stroke:2px var(--rd)}
.hero p{font-size:clamp(16px,2.6vw,24px);letter-spacing:.35em;color:var(--mut);margin:18px 0 30px;text-transform:uppercase}
.wrap{max-width:1200px;margin:0 auto;padding:56px 18px}
.wrap h2{font-size:clamp(30px,5vw,52px);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px}
.card{background:linear-gradient(#120505,#080303);border:1px solid var(--ln);display:block;position:relative;transition:transform .25s,border-color .25s;border-radius:2px}
.card:hover{transform:translateY(-4px);border-color:var(--rd)}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:radial-gradient(circle at 50% 40%,#2a0707,#0a0303)}
.card .in{padding:12px 14px 16px}.card h3{font-size:19px}
.pr{font-weight:700}.pr s{color:var(--mut);font-weight:400;margin-left:8px}.pr em{color:var(--rd);font-style:normal}
.tag{position:absolute;top:10px;left:10px;background:var(--rd);font:700 12px Barlow;padding:3px 8px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cats a{padding:34px 12px;border:1px solid var(--ln);text-align:center;font-family:Anton;font-size:22px;letter-spacing:.08em;background:linear-gradient(135deg,#1a0000,#050505)}
.cats a:hover{border-color:var(--rd);color:var(--rd)}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media(max-width:800px){.pd{grid-template-columns:1fr}}
.pd .main{width:100%;aspect-ratio:1;object-fit:contain;background:radial-gradient(circle at 50% 40%,#2a0707,#080303);border:1px solid var(--ln)}
.pd h1{font-size:clamp(34px,6vw,56px)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.chip{border:1px solid #5a2a2a;background:none;padding:8px 14px;min-width:48px;border-radius:2px}.chip.on{background:var(--rd);border-color:var(--rd)}
.q{display:inline-flex;border:1px solid #5a2a2a;margin-bottom:18px}.q button{width:44px;background:none;border:0}.q span{width:44px;display:grid;place-items:center}
.row{display:flex;gap:12px;flex-wrap:wrap}
footer{border-top:1px solid var(--ln);padding:40px 18px;text-align:center;color:var(--mut);background:#080202}
footer .logo{color:#fff;margin-bottom:8px}
table{width:100%;border-collapse:collapse}td,th{padding:10px 6px;border-bottom:1px solid var(--ln);text-align:left}.scroll{overflow-x:auto}
input,select,textarea{background:#120505;border:1px solid #4a2020;padding:10px;width:100%;margin:4px 0 12px;border-radius:2px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--rd);padding:10px 20px;z-index:60;font-weight:700}
/* intro */
#intro{position:fixed;inset:0;z-index:50;background:#000;overflow:hidden;display:grid;place-items:center;perspective:900px;animation:fin .5s}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
.light{position:absolute;width:140vmax;height:140vmax;left:50%;top:50%;margin:-70vmax;background:conic-gradient(from 0deg,transparent 0 80%,var(--ac) 90%,transparent 100%);opacity:0;mix-blend-mode:screen;animation:spin 6s linear forwards,lin 2s 1s forwards;filter:blur(40px)}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,var(--ac),transparent 55%);opacity:0;animation:lin 3s 0.5s forwards}
.ilogo{position:absolute;top:9vh;font:400 clamp(30px,8vw,64px) Anton;letter-spacing:.2em;animation:logo 1.6s .4s both;transform-style:preserve-3d}.ilogo b{color:var(--rd);font-weight:400}
.itee{position:relative;width:min(78vw,52vh);aspect-ratio:1;object-fit:cover;filter:drop-shadow(0 0 40px var(--ac));transform-style:preserve-3d;opacity:0}
.v0 .itee{animation:tee0 5.2s 1.4s forwards}.v1 .itee{animation:tee1 5.2s 1.4s forwards}.v2 .itee{animation:tee2 5.2s 1.4s forwards}
.iname{position:absolute;bottom:11vh;font:400 clamp(30px,9vw,80px) Anton;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:0 12px;animation:name 2s 3.6s both}
.skip{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top,0px));z-index:3;background:#0008;border:1px solid #fff5;padding:8px 16px;letter-spacing:.1em}
@keyframes fin{from{opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes lin{to{opacity:.55}}
@keyframes logo{from{opacity:0;transform:rotateY(180deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes tee0{0%{opacity:0;transform:scale(.3) rotateY(-40deg)}25%{opacity:1}100%{opacity:1;transform:scale(1.18) rotateY(14deg)}}
@keyframes tee1{0%{opacity:0;transform:translateY(60px) scale(.6) rotateX(40deg)}30%{opacity:1}100%{opacity:1;transform:scale(1.15) rotateY(-18deg) rotateX(-4deg)}}
@keyframes tee2{0%{opacity:0;transform:scale(1.6) rotateZ(-8deg);filter:blur(14px)}30%{opacity:1;filter:none}100%{opacity:1;transform:scale(1.1) rotateY(24deg)}}
@keyframes name{from{opacity:0;letter-spacing:.9em;filter:blur(8px)}}
html{-webkit-text-size-adjust:100%}body{-webkit-tap-highlight-color:transparent}
@keyframes name2{from{opacity:0;letter-spacing:.4em;filter:blur(8px)}}
@media(max-width:600px){header{flex-wrap:wrap;gap:4px;padding:8px 12px}.logo{font-size:22px}nav{width:100%;justify-content:space-between;margin:0}nav a,nav button{padding:8px 6px;font-size:12px;letter-spacing:.03em;min-height:40px}.wrap{padding:36px 14px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card h3{font-size:15px}.card .in{padding:8px 10px 12px}.pd{gap:20px}.row .btn{flex:1 1 100%}.iname{letter-spacing:.12em;animation-name:name2}.hero p{letter-spacing:.2em}td,th{padding:8px 4px;font-size:14px}.q{margin-bottom:14px}}
@media(max-height:520px) and (orientation:landscape){.ilogo{top:3vh;font-size:26px}.iname{bottom:3vh;font-size:28px;letter-spacing:.12em;animation-name:name2}.itee{width:min(60vh,50vw)}.hero{min-height:auto;padding:60px 18px}}
@media(min-width:1400px){.wrap{max-width:1360px}.grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}}
@media(hover:none){.card:hover{transform:none}}
.al{display:grid;gap:10px}.ar{display:flex;gap:12px;align-items:center;border:1px solid var(--ln);padding:10px;background:#0c0404;min-width:0;overflow-wrap:anywhere}.ar img{width:64px;height:64px;object-fit:contain}.ar .g{flex:1;display:grid;gap:4px}.fm1{display:grid;gap:2px;max-width:560px}summary{cursor:pointer;padding:10px 0;font-weight:700}input[type=file]{padding:8px}
@media(prefers-reduced-motion:reduce){.btn:after,.light{animation:none}}
</style></head><body>

app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sz=b.dataset.s;draw()});app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{col=b.dataset.c;draw()});app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{im=+b.dataset.i;draw()});
$("#m").onclick=()=>{q=Math.max(1,q-1);draw()};$("#pl").onclick=()=>{q=Math.min(10,q+1);draw()};
const add=()=>{const k=cart.find(x=>x.id===id&&x.sz===sz&&x.col===col);k?k.q+=q:cart.push({id,sz,col,q});updCart()};
$("#add").onclick=()=>{add();toast("Added to cart")};$("#buy").onclick=()=>{add();location.hash="#/cart"};$("#rp").onclick=e=>{e.preventDefault();prod(id)}};draw()}
const GOV=["Cairo","Giza","Alexandria","Qalyubia","Sharqia","Dakahlia","Gharbia","Menoufia","Beheira","Kafr El Sheikh","Damietta","Port Said","Ismailia","Suez","North Sinai","South Sinai","Red Sea","Fayoum","Beni Suef","Minya","Assiut","Sohag","Qena","Luxor","Aswan","Matrouh","New Valley"];
function lines(){return cart.map((c,i)=>{const p=P.find(x=>x.id===c.id);return p?{c,p,i}:null}).filter(Boolean)}
function total(){return lines().reduce((a,r)=>a+(r.p.sale||r.p.price)*r.c.q,0)}
function cartPg(){const L=lines();app.innerHTML=`<section class="wrap"><h2>Your cart</h2>${L.length?`<div class="al">${L.map(r=>`<div class="ar"><img src="${r.p.imgs[0]}" alt=""><div class="g"><b>${esc(r.p.name)}</b><small>${r.c.sz} · ${esc(r.c.col)}</small><div class="q"><button data-m="${r.i}">−</button><span>${r.c.q}</span><button data-a="${r.i}">+</button></div></div><div>${money((r.p.sale||r.p.price)*r.c.q)}<br><button class="chip" data-r="${r.i}">Remove</button></div></div>`).join("")}</div><h3 style="margin:20px 0">Total ${money(total())}</h3><a class="btn" href="#/checkout">CHECKOUT</a>`:'<p>Your cart is empty.</p><a class="btn" href="#/shop">SHOP NOW</a>'}</section>`;
app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const c=cart[+b.dataset.m];c.q=Math.max(1,c.q-1);updCart();cartPg()});
app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const c=cart[+b.dataset.a];c.q=Math.min(10,c.q+1);updCart();cartPg()});
app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.r,1);updCart();cartPg()})}
function checkout(){const L=lines();if(!L.length){location.hash="#/cart";return}
app.innerHTML=`<section class="wrap"><h2>Checkout</h2><div class="pd"><div class="fm1"><label>Full name<input id="n" autocomplete="name"></label><label>Phone<input id="ph" type="tel" inputmode="tel" autocomplete="tel"></label><label>WhatsApp number<input id="wa" type="tel" inputmode="tel"></label><label>Governorate<select id="gv">${GOV.map(g=>`<option>${g}</option>`).join("")}</select></label><label>City or area<input id="ct"></label><label>Full address<textarea id="ad" rows="3"></textarea></label><label>Delivery notes<textarea id="nt" rows="2"></textarea></label><b>Payment</b><label style="display:flex;gap:8px;align-items:center"><input type="radio" checked style="width:auto;margin:0"> Cash on delivery</label><small style="color:var(--mut)">Online card payment is not available yet.</small></div><div class="card in"><h3>Order summary</h3>${L.map(r=>`<p>${esc(r.p.name)} (${r.c.sz}, ${esc(r.c.col)}) ×${r.c.q}<br>${money((r.p.sale||r.p.price)*r.c.q)}</p>`).join("")}<h3 style="margin-bottom:12px">Total ${money(total())}</h3><button class="btn" id="co">PLACE ORDER</button></div></div></section>`;
$("#co").onclick=async()=>{const v=i=>$("#"+i).value.trim(),n=v("n"),ph=v("ph");if(n.length<3||!/^[0-9+\s-]{8,16}$/.test(ph)||!v("ct")||v("ad").length<8){toast("Check name, phone, city and address");return}
if(!db){toast("Ordering needs the store connection. Open the page from your claude.ai account.");return}
const no="GS-"+Date.now().toString(36).toUpperCase().slice(-5)+Math.random().toString(36).toUpperCase().slice(2,4),t=Date.now();
const o={no,t,status:"New",pay:"COD",n,ph,wa:v("wa"),gv:v("gv"),ct:v("ct"),ad:v("ad"),nt:v("nt"),tot:total(),items:L.map(r=>({name:r.p.name,sz:r.c.sz,col:r.c.col,q:r.c.q,pr:r.p.sale||r.p.price}))};
$("#co").disabled=true;try{await db.doc("orders/"+no).set(o);await db.doc("track/"+no).set({status:"New",t,ph:ph.slice(-4)});cart=[];updCart();location.hash="#/done/"+no}catch(e){$("#co").disabled=false;toast("Order failed. Try again")}}}
function doneP(no){app.innerHTML=`<section class="wrap"><h2>Order placed</h2><p>Your order number is <b>${esc(no||"")}</b>. Keep it, with the last 4 digits of your phone, to track the order. Pay cash on delivery.</p><a class="btn" href="#/track/${esc(no||"")}">TRACK ORDER</a></section>`}
function track(no){app.innerHTML=`<section class="wrap"><h2>Track order</h2><div class="fm1"><label>Order number<input id="tn" value="${esc(no||"")}"></label><label>Last 4 digits of phone<input id="tp" inputmode="numeric" maxlength="4"></label><button class="btn" id="tg">TRACK</button><p id="tr"></p></div></section>`;
$("#tg").onclick=async()=>{const n=$("#tn").value.trim().toUpperCase(),r=$("#tr");if(!db){r.textContent="Tracking needs the store connection.";return}try{const s=await db.doc("track/"+n).get(),d=s.exists&&s.data();r.textContent=d&&d.ph===$("#tp").value.trim()?"Status: "+d.status+" (updated "+new Date(d.t).toLocaleString()+")":"No matching order. Check the number and phone digits."}catch(e){r.textContent="Could not load. Try again."}}}
async function save(){if(!db){ls.set("gs_cat",P);return}try{await db.doc("catalog/main").set({json:JSON.stringify(P.map(ser))})}catch(e){ls.set("gs_cat",P);toast("Saved on this device only")}}
const ST=["New","Accepted","Rejected","Shipped","Delivered"],FXN=["smoke","ember","shatter","web","bolt","slash"];let OR=[];
const ser=p=>({...p,imgs:p.imgs.map(u=>u.startsWith("data:")?"@"+I.indexOf(u):u)});
const opt=(a,v)=>a.map(x=>`<option ${x==v?"selected":""}>${x}</option>`).join("");
function ordHtml(q){q=(q||"").toLowerCase();return OR.filter(o=>!q||o.no.toLowerCase().includes(q)||String(o.ph).includes(q)||String(o.wa||"").includes(q)).map(o=>`<div class="ar" style="display:block"><b>${esc(o.no)}</b> · ${new Date(o.t).toLocaleString()} · ${money(o.tot)}<br>${esc(o.n)} · ${esc(o.ph)} · WA ${esc(o.wa||"-")}<br>${esc(o.gv)}, ${esc(o.ct)}, ${esc(o.ad)}${o.nt?"<br><i>"+esc(o.nt)+"</i>":""}<br>${o.items.map(i=>`${esc(i.name)} ${i.sz}/${esc(i.col)} ×${i.q}`).join("; ")}<br><select data-st="${esc(o.no)}">${opt(ST,o.status)}</select></div>`).join("")||"<p>No orders.</p>"}
async function admin(){if(!isAdmin){app.innerHTML='<section class="wrap"><h2>Admin</h2><p>Only the page owner or editors can manage the store. Open this page from your claude.ai account to sign in.</p></section>';return}
app.innerHTML=`<section class="wrap"><h2>Admin</h2><div class="grid" style="margin-bottom:30px"><div class="card in"><h3>${P.length}</h3>Products</div><div class="card in"><h3 id="oc">…</h3>Orders</div><div class="card in"><h3 id="rv">…</h3>Revenue</div></div>
<h2 style="font-size:30px">Orders</h2><input id="os" placeholder="Search by order number or phone" type="search"><div id="ol" class="al"></div>
<h2 style="font-size:30px;margin-top:36px">Add product</h2><div class="fm"><div><label>Name<input id="an"></label></div><div><label>Price<input id="apr" type="number" inputmode="numeric"></label></div><div><label>Discount price<input id="asl" type="number" inputmode="numeric"></label></div><div><label>Category<input id="ac"></label></div><div><label>Colors (comma)<input id="acl"></label></div><div><label>Stock<input id="ast" type="number" value="25"></label></div></div><label>Description<textarea id="ad2"></textarea></label><label>Images (from gallery, several allowed)<input id="af" type="file" accept="image/*" multiple></label><button class="btn" id="adp">SAVE PRODUCT</button>
<h2 style="font-size:30px;margin-top:36px">Products</h2><div class="al">${P.map(p=>`<div class="ar" style="display:block"><div class="row" style="align-items:center;flex-wrap:nowrap"><img src="${p.imgs[0]}" alt="" style="width:56px;height:56px;object-fit:contain"><b style="flex:1">${esc(p.name)}</b><button class="chip" data-del="${p.id}">Delete</button></div><div class="fm"><label>Price<input data-id="${p.id}" data-f="price" type="number" value="${p.price}"></label><label>Discount<input data-id="${p.id}" data-f="sale" type="number" value="${p.sale||0}"></label><label>Stock<input data-id="${p.id}" data-f="stock" type="number" value="${p.stock||0}"></label></div><label><input data-id="${p.id}" data-f="feat" type="checkbox" ${p.feat?"checked":""} style="width:auto;margin:0 8px 0 0">Featured</label>
<details><summary>Intro settings</summary><label><input data-id="${p.id}" data-f="intro" type="checkbox" ${p.intro?"checked":""} style="width:auto;margin:0 8px 0 0">Intro enabled</label><div class="fm"><label>Background effect<select data-id="${p.id}" data-f="fx">${opt(FXN,p.fx)}</select></label><label>Camera style<select data-id="${p.id}" data-f="variant" data-n="1">${[0,1,2].map(x=>`<option ${x==p.variant?"selected":""}>${x}</option>`).join("")}</select></label><label>Duration (3–15 s)<input data-id="${p.id}" data-f="dur" type="number" min="3" max="15" value="${p.dur}"></label></div><label><input data-id="${p.id}" data-f="bg" type="checkbox" ${p.bg!==false?"checked":""} style="width:auto;margin:0 8px 0 0">Background effects on</label><label>Custom intro video<input type="file" accept="video/*" data-vid="${p.id}"></label>${p.vid?`<button class="chip" data-rv="${p.id}">Remove video</button> `:""}<button class="chip" data-pv="${p.id}">Preview intro</button></details></div>`).join("")}</div></section>`;
const rl=q=>{$("#ol").innerHTML=ordHtml(q)};$("#os").oninput=e=>rl(e.target.value);
if(db){await loadOr()}$("#oc").textContent=OR.length;$("#rv").textContent=money(OR.filter(o=>o.status!="Rejected").reduce((a,b)=>a+b.tot,0));rl("");
$("#ol").onchange=async e=>{const n=e.target.dataset.st;if(!n)return;try{await db.doc("orders/"+n).update({status:e.target.value});await db.doc("track/"+n).update({status:e.target.value,t:Date.now()});OR.find(o=>o.no==n).status=e.target.value;toast("Status updated")}catch(x){toast("Update failed")}};
app.querySelectorAll("[data-f]").forEach(i=>i.onchange=()=>{const p=P.find(x=>x.id==i.dataset.id);p[i.dataset.f]=i.type=="checkbox"?i.checked:(i.type=="number"||i.dataset.n)?+i.value:i.value;save()});
app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Delete this product?")){P=P.filter(p=>p.id!=b.dataset.del);save();admin()}});
app.querySelectorAll("[data-pv]").forEach(b=>b.onclick=()=>intro(P.find(p=>p.id==b.dataset.pv),()=>{}));
app.querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>{P.find(p=>p.id==b.dataset.rv).vid="";save();admin()});
app.querySelectorAll("[data-vid]").forEach(i=>i.onchange=async()=>{if(!i.files[0])return;try{const as=await claude.use("assets");P.find(p=>p.id==i.dataset.vid).vid=(await as.upload(i.files[0])).url;await save();toast("Video saved");admin()}catch(e){toast("Video upload failed")}});
$("#adp").onclick=async()=>{const n=$("#an").value.trim(),pr=+$("#apr").value,f=[...$("#af").files];if(!n||!pr||!f.length){toast("Name, price and an image are required");return}
let imgs=[];try{const as=await claude.use("assets");for(const x of f)imgs.push((await as.upload(x)).url)}catch(e){toast("Image upload failed");return}
P.push(nz({id:"p"+Date.now(),name:n,cat:$("#ac").value.trim()||"General",price:pr,sale:+$("#asl").value||0,colors:($("#acl").value||"Black").split(",").map(s=>s.trim()),sizes:SZ,desc:$("#ad2").value,imgs,accent:"#E50914",variant:P.length%3,intro:true,feat:false,isNew:true,best:false,stock:+$("#ast").value||0}));await save();toast("Product saved");admin()}}
function route(){scrollTo(0,0);$("#ov").innerHTML="";const[,a,b]=(location.hash||"#/").split("/");({"":home,undefined:home,shop:()=>shop(b&&decodeURIComponent(b)),p:()=>prod(b),cart:cartPg,checkout,track:()=>track(b),done:()=>doneP(b),admin}[a]||home)()}
addEventListener("hashchange",route);updCart();setIT();route();
(async()=>{try{const u=await claude.use("user");isAdmin=!!(u&&u.canEdit());db=await claude.use("db");if(db){const d=await db.doc("catalog/main").get();const j=d&&d.exists!==false&&(d.data?d.data():d);if(j&&j.json)P=JSON.parse(j.json).map(p=>({...p,imgs:p.imgs.map(u=>u[0]=="@"?I[+u.slice(1)]:u)}))}else{const c=ls.get("gs_cat");if(c)P=c}}catch(e){const c=ls.get("gs_cat");if(c)P=c}
P.forEach(nz);if(!/^#\/p\//.test(location.hash))route()})();
</script></body></html>
